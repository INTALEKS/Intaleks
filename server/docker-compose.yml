name: thevaluer

services:
  postgres:
    image: postgres:15-alpine
    container_name: thevaluer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intaleks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intaleks_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-intaleks_dev}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intaleks}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - thevaluer-network

  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: thevaluer-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5001}:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-intaleks}:${POSTGRES_PASSWORD:-intaleks_dev_2024}@postgres:5432/${POSTGRES_DB:-intaleks_dev}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_ACCOUNT_ID: ${STRIPE_ACCOUNT_ID}
      # Email
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@intaleks.com}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL}
      # Storage
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - thevaluer-network
    command: pnpm dev

volumes:
  pgdata:
    driver: local

networks:
  thevaluer-network:
    driver: bridge
